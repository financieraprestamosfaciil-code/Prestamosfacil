<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Directo Meta AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-chrome {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            width: 100%;
            margin-bottom: 15px;
        }
        .instructions {
            background-color: #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: left;
        }
        .instructions ol {
            margin-left: 20px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Meta AI Directo</h1>
        <p>Accede a tu conversación guardada y anclala en tu dispositivo.</p>
        <a href="https://www.meta.ai/share/a/33d0b9bb-3eef-4d5d-922e-97f4fbc76a50" target="_blank" rel="noopener noreferrer" class="btn-chrome">
           Abrir Meta AI
        </a>
        <div class="instructions">
            <strong>📲 ¿Cómo agregarlo a la pantalla de inicio?</strong>
            <ol>
                <li>Abre el enlace en <b>Google Chrome</b>.</li>
                <li>Toca los tres puntos <span style="font-size: 1.2rem;">⋮</span> arriba a la derecha.</li>
                <li>Selecciona <b>"Agregar a la pantalla de inicio"</b> o <b>"Instalar aplicación"</b>.</li>
            </ol>
        </div>
    </div>
</body>
</html>
